<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project - AI Dev Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0E0F12;
            color: #E8E9EB;
            font-size: 14px;
        }
        .header { 
            background: #17191D; 
            border-bottom: 1px solid #2A2D33;
            color: #E8E9EB; 
            padding: 16px; 
            position: sticky; 
            top: 0; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .back { color: #E8E9EB; text-decoration: none; font-size: 20px; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .container { padding: 16px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #E8E9EB; }
        textarea { 
            width: 100%; 
            min-height: 150px; 
            padding: 12px; 
            border: 1px solid #2A2D33; 
            border-radius: 8px; 
            font-size: 16px; 
            resize: vertical; 
            background: #17191D; 
            color: #E8E9EB;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #6366F1;
        }
        .voice-btn { 
            position: relative; 
            display: inline-block; 
            background: #6366F1;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn { 
            width: 100%; 
            padding: 16px; 
            background: #6366F1; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer;
        }
        .btn:disabled { 
            background: #2A2D33;
            color: #9A9DA6;
        }
        .loading { text-align: center; padding: 40px; color: #9A9DA6; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back">←</a>
        <h1>New Project</h1>
    </div>
    <div class="container">
        <form id="ideaForm">
            <div class="form-group">
                <label for="idea">Describe your idea</label>
                <div class="voice-btn" onclick="alert('Voice input would be implemented here')">🎤 Voice input</div>
                <textarea id="idea" name="idea_text" placeholder="A simple calculator web app that can add, subtract, multiply, and divide..."></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">Analyze</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('ideaForm');
        const btn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            
            const ideaText = document.getElementById('idea').value;
            
            try {
                const resp = await fetch('/new', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({idea_text: ideaText})
                });
                const data = await resp.json();
                
                if (data.project_id) {
                    window.location.href = `/project/${data.project_id}/questions`;
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                    btn.disabled = false;
                    btn.textContent = 'Analyze';
                }
            } catch (err) {
                alert('Error: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        });
    </script>
</body>
</html>
