<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project - AI Dev Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .header { background: #1a1a2e; color: white; padding: 16px; position: sticky; top: 0; display: flex; align-items: center; gap: 12px; }
        .back { color: white; text-decoration: none; font-size: 20px; }
        .header h1 { font-size: 18px; }
        .container { padding: 16px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; resize: vertical; }
        .voice-btn { position: relative; display: inline-block; }
        .btn { width: 100%; padding: 16px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:disabled { background: #ccc; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back">←</a>
        <h1>New Project</h1>
    </div>
    <div class="container">
        <form id="ideaForm">
            <div class="form-group">
                <label for="idea">Describe your idea</label>
                <textarea id="idea" name="idea_text" placeholder="A simple calculator web app that can add, subtract, multiply, and divide..."></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">Analyze</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('ideaForm');
        const btn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            
            const ideaText = document.getElementById('idea').value;
            
            try {
                const resp = await fetch('/new', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({idea_text: ideaText})
                });
                const data = await resp.json();
                
                if (data.project_id) {
                    window.location.href = `/project/${data.project_id}/questions`;
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                    btn.disabled = false;
                    btn.textContent = 'Analyze';
                }
            } catch (err) {
                alert('Error: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        });
    </script>
</body>
</html>
