

<!DOCTYPE html>
<html>
<head>
    <title> - Build System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0E0F12;
            color: #E8E9EB;
            font-size: 14px;
            line-height: 1.5;
        }
        .nav-rail {
            width: 72px;
            height: 100vh;
            background: #17191D;
            border-right: 1px solid #2A2D33;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }
        .nav-item {
            width: 100%;
            padding: 12px;
            text-align: center;
            color: #9A9DA6;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: #E8E9EB; }
        .nav-item svg { width: 20px; height: 20px; }
        .main-content {
            margin-left: 72px;
            padding: 24px;
            min-height: 100vh;
        }
        .card {
            background: #17191D;
            border: 1px solid #2A2D33;
            border-radius: 8px;
            padding: 16px;
        }
        .btn {
            background: #6366F1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #2A2D33;
            color: #E8E9EB;
        }
        .input {
            background: #0E0F12;
            border: 1px solid #2A2D33;
            color: #E8E9EB;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 14px;
        }
        .input:focus {
            outline: none;
            border-color: #6366F1;
        }
        textarea.input { resize: vertical; min-height: 120px; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-progress { background: #3B82F6; color: white; }
        .badge-success { background: #22C55E; color: white; }
        .badge-warning { background: #F59E0B; color: white; }
        .badge-error { background: #EF4444; color: white; }
        .text-secondary { color: #9A9DA6; }
        .text-accent { color: #6366F1; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-8 { gap: 8px; }
        .gap-16 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mt-16 { margin-top: 16px; }
        .mt-24 { margin-top: 24px; }
        .mb-16 { margin-bottom: 16px; }
        .mb-24 { margin-bottom: 24px; }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        @media (max-width: 768px) {
            .project-grid { grid-template-columns: 1fr; }
        }
        .project-card {
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .project-card:hover { border-color: #6366F1; }
        .progress-bar {
            height: 4px;
            background: #2A2D33;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: #3B82F6;
            transition: width 0.3s;
        }
        .tab-bar {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #2A2D33;
            margin-bottom: 24px;
        }
        .tab {
            padding: 12px 16px;
            color: #9A9DA6;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab:hover { color: #E8E9EB; }
        .tab.active { 
            color: #6366F1;
            border-bottom-color: #6366F1;
        }
        .question-item {
            background: #17191D;
            border: 1px solid #2A2D33;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .question-text { font-size: 16px; margin-bottom: 8px; }
        .question-hint { 
            font-size: 12px; 
            color: #9A9DA6;
            margin-bottom: 12px;
        }
        .log-entry {
            padding: 8px 12px;
            border-left: 3px solid #2A2D33;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        .log-generator { border-left-color: #3B82F6; }
        .log-critic { border-left-color: #F59E0B; }
        .log-verifier { border-left-color: #22C55E; }
        .log-tester { border-left-color: #6366F1; }
        .activity-stream {
            max-height: 400px;
            overflow-y: auto;
            padding: 16px;
            background: #0E0F12;
            border-radius: 8px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: #9A9DA6;
        }
        .empty-state p { margin-bottom: 16px; }
        .inline-form { max-width: 640px; margin: 0 auto; }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #9A9DA6;
            margin-bottom: 12px;
        }
        .code-preview {
            background: #0E0F12;
            border: 1px solid #2A2D33;
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <nav class="nav-rail">

            </svg>

                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
        </a>
    </nav>
    
    <main class="main-content">
        
<div class="top-bar">
    <h1>Projects</h1>
    <div class="flex gap-8">
        <a href="/import/github"><button class="btn btn-secondary">Import from GitHub</button></a>
        <a href="/new-project"><button class="btn">New project</button></a>
    </div>
</div>


<div class="project-grid">
    
    <a href="/project/proj_1" class="card project-card">
        <div class="flex justify-between items-center mb-16">
            <strong>A simple task manager app with add, complete, dele...</strong>
            <span class="badge badge-progress">foundation</span>
        </div>
        <p class="text-secondary">building</p>
        <div class="progress-bar">
            <div class="progress-fill" style="width: 25%"></div>
        </div>
        <p class="text-secondary mt-16" style="font-size: 12px">updated just now</p>
    </a>
    
</div>


    </main>
</body>
</html>
